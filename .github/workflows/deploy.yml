# Deploys the Worker (API + web page) on every push to main that touches it.
# Needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit, D1: Edit).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the one in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The web page's modules (engine math, costs, grouping, CVT events): plain Node, no install.
      - run: node --test ../web/test/*.test.mjs
      # Migrations first, so the new code never runs against an old schema.
      - run: npx wrangler d1 migrations apply fuelish --remote
      - run: npx wrangler deploy
